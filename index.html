<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D2lang Vision LLM Pipeline | Temps Réel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        header {
            width: 100%;
            background-color: #313244;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        header h1 { margin: 0; color: #fab387; }

        .container {
            display: flex;
            width: 90%;
            max-width: 1400px;
            margin-top: 20px;
            gap: 20px;
        }
        .controls-panel, .log-panel {
            background-color: #282a36;
            padding: 20px;
            border-radius: 8px;
            flex-grow: 1;
        }
        .controls-panel { width: 30%; min-width: 300px; }
        .log-panel { width: 70%; max-height: 70vh; overflow-y: auto; }

        #promptInput {
            width: 100%; padding: 10px; margin-bottom: 15px;
            border-radius: 4px; border: 1px solid #45475a;
            background-color: #313244; color: #cdd6f4;
        }
        #runButton {
            width: 100%; padding: 10px;
            background-color: #a6e3a1;
            color: #1e1e2e; border: none;
            border-radius: 4px; cursor: pointer;
            font-weight: bold; transition: 0.2s;
        }
        #runButton:hover:not(:disabled) { background-color: #89b4fa; }
        #runButton:disabled { background-color: #6c7086; cursor: not-allowed; }

        .log-entry {
            border-bottom: 1px dashed #45475a;
            padding: 8px 0; font-size: 0.9em;
            white-space: pre-wrap;
        }
        .log-end { color: #a6e3a1; font-weight: bold; text-align:center; }
        .log-error { color: #f38ba8; }
        .log-highlight { color: #f9e2af; }
        .log-success { color: #a6e3a1; }

        .iterations-panel {
            width: 100%; margin-top: 30px;
            background-color: #282a36;
            padding: 20px; border-radius: 8px;
        }
        .iteration-card {
            border: 1px solid #45475a;
            border-radius: 8px; padding: 15px;
            margin-bottom: 20px;
        }
        .iteration-card.success {
            border: 2px solid #a6e3a1;
        }
        .iteration-content { display: flex; gap: 20px; }
        .iteration-image-container img {
            max-width: 100%; border-radius: 4px;
            border: 1px solid #45475a;
        }
        .metric {
            background-color: #313244;
            padding: 5px; border-radius:4px;
            margin-bottom: 5px;
        }
        .metric span { font-weight:bold; }
    </style>
</head>

<body>

<header>
    <h1>D2lang Vision LLM Pipeline ✨</h1>
    <p>Génération auto-corrigée en temps réel</p>
</header>

<div class="container">
    <div class="controls-panel">
        <h2>Prompt Utilisateur</h2>

        <input type="text" id="promptInput"
               value="Deux clients parlent à un serveur et une base de données">

        <button id="runButton">▶️ Lancer le Pipeline</button>

        <h2 style="margin-top:30px;">Logs en direct</h2>
        <div class="log-panel" id="logOutput">
            <p class="log-entry log-highlight">
                Prêt. Entrez un prompt et cliquez sur Lancer.
            </p>
        </div>
    </div>

    <div class="iterations-panel">
        <h2>Résultats des Itérations</h2>
        <div id="iterationsOutput">
            <p style="text-align:center;color:#6c7086;">
                Les diagrammes apparaîtront ici.
            </p>
        </div>
    </div>
</div>

<script>
let eventSource;
let currentIter = null;            // itération courante
const promptInput = document.getElementById("promptInput");
const runButton = document.getElementById("runButton");
const logOutput = document.getElementById("logOutput");
const iterationsOutput = document.getElementById("iterationsOutput");

/* -------------------------------------------------------
   🚀 Démarrage du pipeline
------------------------------------------------------- */
function startPipeline() {
    if (eventSource) eventSource.close();
    logOutput.innerHTML = "";
    iterationsOutput.innerHTML = "";
    currentIter = null;

    const prompt = promptInput.value.trim();
    if (!prompt) return alert("Veuillez entrer un prompt.");

    runButton.disabled = true;
    runButton.textContent = "🔄 Pipeline en cours...";

    eventSource = new EventSource(`/logs?prompt=${encodeURIComponent(prompt)}`);

    eventSource.onmessage = (event) => {
        const data = event.data;

        // Fin de pipeline
        if (data === "[END]") {
            appendLog("Pipeline terminé.", "log-success");
            runButton.disabled = false;
            runButton.textContent = "Lancer un nouveau pipeline";
            eventSource.close();
            return;
        }

        // Message IMAGE:...
        if (data.startsWith("IMAGE:")) {
            const payload = JSON.parse(data.substring(6));
            currentIter = payload.iter;                 // on associe la suite à cette itération
            displayIteration(currentIter, payload.file);
            return; // on ne log pas la ligne IMAGE
        }

        // Le reste = texte normal (stdout/stderr)
        // On le split au cas où le chunk contient plusieurs lignes
        const lines = data.split("\n");
        for (const lineRaw of lines) {
            const line = lineRaw.trim();
            if (!line) continue;

            // Affichage dans la zone logs
            let className = "log-entry";
            if (line.includes("❌")) className += " log-error";
            if (line.includes("Similarité")) className += " log-highlight";
            appendLog(line, className);

            // Si aucune itération courante, on ignore les métriques
            if (!currentIter) continue;

            // Caption pour l'itération courante
            if (line.startsWith("🧠 Caption générée :")) {
                const caption = line.replace("🧠 Caption générée :", "").trim();
                const captionSpan = document.getElementById(`caption-${currentIter}`);
                const captionBlock = document.getElementById(`caption-block-${currentIter}`);
                if (captionSpan && captionBlock) {
                    captionSpan.textContent = caption;
                    captionBlock.style.display = "block";
                }
            }

            // Similarité cosinus pour l'itération courante
            if (line.includes("Similarité cosinus")) {
                const match = line.match(/Similarité cosinus\s*:\s*(\d+\.\d+)/);
                if (match) {
                    const sim = parseFloat(match[1]);
                    const simSpan = document.getElementById(`sim-${currentIter}`);
                    const simBlock = document.getElementById(`sim-block-${currentIter}`);
                    const statusSpan = document.getElementById(`status-${currentIter}`);
                    const card = document.getElementById(`iteration-card-${currentIter}`);

                    if (simSpan && simBlock) {
                        simSpan.textContent = sim.toFixed(3);
                        simBlock.style.display = "block";
                    }
                    if (statusSpan && card) {
                        if (sim >= 0.90) {
                            statusSpan.textContent = "✅ SUCCÈS (Cohérence atteinte)";
                            card.classList.add("success");
                        } else {
                            statusSpan.textContent = "🔄 Une nouvelle itération est nécessaire";
                        }
                    }
                }
            }
        }
    };

    eventSource.onerror = () => {
        appendLog("❌ Erreur SSE", "log-error");
        runButton.disabled = false;
        runButton.textContent = "Réessayer";
        eventSource.close();
    };
}

/* -------------------------------------------------------
   📝 Ajout d'une ligne de log dans l’UI
------------------------------------------------------- */
function appendLog(text, className = "log-entry") {
    const p = document.createElement("p");
    p.className = className;
    p.textContent = text;
    logOutput.appendChild(p);
    logOutput.scrollTop = logOutput.scrollHeight;
}

/* -------------------------------------------------------
   🖼️ Création ou mise à jour d’une carte d’itération
------------------------------------------------------- */
function displayIteration(iter, filePath) {
    const id = `iteration-card-${iter}`;
    let card = document.getElementById(id);

    if (!card) {
        card = document.createElement("div");
        card.id = id;
        card.className = "iteration-card";

        card.innerHTML = `
            <h3>🔁 Itération ${iter}</h3>
            <div class="iteration-content">
                <div class="iteration-image-container">
                    <img src="${filePath}?t=${Date.now()}" 
                         alt="Diagramme Itération ${iter}">
                </div>
                <div class="iteration-details">
                    <p class="metric">
                        Statut : <span id="status-${iter}">Compilation réussie</span>
                    </p>
                    <div class="metric" id="caption-block-${iter}" style="display:none;">
                        Caption (Pixtral) : 
                        <span id="caption-${iter}"></span>
                    </div>
                    <div class="metric" id="sim-block-${iter}" style="display:none;">
                        Similarité cosinus : 
                        <span id="sim-${iter}"></span>
                    </div>
                </div>
            </div>
        `;

        // on met la dernière itération en haut
        iterationsOutput.prepend(card);

    } else {
        // si la carte existe déjà (re-run), on rafraîchit l'image
        const img = card.querySelector("img");
        if (img) {
            img.src = `${filePath}?t=${Date.now()}`;
        }
    }
}

runButton.addEventListener("click", startPipeline);
</script>

</body>
</html>
